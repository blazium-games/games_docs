name: Propagate discovery files

# On every push to master: test the generator, then open or update a refresh PR in games_nginx
# (public/llms.txt, llms-full.txt, skill.md, .well-known/agent-skills) and games_mcp (llms.txt,
# llms-full.txt). Each repo pins the games_docs commit in docs-ref and checks it in CI.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: propagate-discovery
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-plugin.mjs --offline
      - run: node --test scripts/test_discovery.mjs

  refresh:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: games_nginx
            flag: --site
            dir: public
            paths: public docs-ref
          - repo: games_mcp
            flag: --mcp
            dir: .
            paths: llms.txt llms-full.txt docs-ref
    env:
      BOT_TOKEN: ${{ secrets.GAMES_COMMON_BOT_TOKEN }}
      BRANCH: chore/discovery-refresh
    steps:
      - name: Require bot token
        id: token
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "::warning::GAMES_COMMON_BOT_TOKEN is not set; skipping the refresh PR for ${{ matrix.repo }}"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
        with:
          path: docs
      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
        with:
          repository: blazium-games/${{ matrix.repo }}
          token: ${{ secrets.GAMES_COMMON_BOT_TOKEN }}
          path: svc
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 22
      - name: Regenerate
        if: steps.token.outputs.ok == 'true'
        working-directory: svc
        run: |
          node ../docs/scripts/discovery.mjs ${{ matrix.flag }} ${{ matrix.dir }}
          echo "${{ github.sha }}" > docs-ref
      - name: Open or update PR
        if: steps.token.outputs.ok == 'true'
        working-directory: svc
        env:
          GH_TOKEN: ${{ secrets.GAMES_COMMON_BOT_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Already on games_docs ${{ github.sha }}"
            exit 0
          fi
          short="$(echo '${{ github.sha }}' | cut -c1-7)"
          git config user.name "games-docs-bot"
          git config user.email "games-docs-bot@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add ${{ matrix.paths }}
          git commit -m "Refresh discovery files from games_docs ${short}"
          git push --force origin "$BRANCH"
          title="Refresh discovery files from games_docs ${short}"
          body="Generated by node scripts/discovery.mjs at blazium-games/games_docs@${{ github.sha }}. CI checks these files against that commit."
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --title "$title" --body "$body"
          else
            gh pr create --base master --head "$BRANCH" --title "$title" --body "$body"
          fi
